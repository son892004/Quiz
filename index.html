<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Từ Vựng Sơ Cấp 1 - Bài 1</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --bg-gradient: linear-gradient(135deg, #f5f3ff 0%, #e0e7ff 100%);
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --correct-bg: #dcfce7;
    --correct-border: #22c55e;
    --correct-text: #15803d;
    --wrong-bg: #fee2e2;
    --wrong-border: #ef4444;
    --wrong-text: #b91c1c;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 20px 12px;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-main);
  }

  .card {
    width: 100%;
    max-width: 650px;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 26px;
    margin: 0 0 6px 0;
    color: #312e81;
  }

  .sub {
    color: var(--text-muted);
    font-size: 14px;
  }

  .progress-container {
    height: 10px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 16px;
  }

  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s ease;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    margin: 16px 0 20px 0;
    font-weight: 600;
    font-size: 15px;
    color: var(--text-muted);
  }

  .question-box {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    margin: 20px 0 28px 0;
    color: #0f172a;
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answers-grid {
    display: grid;
    gap: 12px;
  }

  .answer-btn {
    padding: 16px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    background: #f8fafc;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-main);
    display: flex;
    align-items: center;
  }

  .answer-btn:hover:not(:disabled) {
    background: #eef2ff;
    border-color: var(--primary);
    transform: translateY(-1px);
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .answer-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    color: var(--correct-text);
  }

  .answer-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    color: var(--wrong-text);
  }

  .feedback {
    text-align: center;
    min-height: 28px;
    margin: 16px 0;
    font-weight: 700;
    font-size: 16px;
  }

  .next-btn, .restart-btn {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 16px;
    background: var(--primary);
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .next-btn:hover, .restart-btn:hover {
    background: var(--primary-hover);
  }

  .next-btn:active, .restart-btn:active {
    transform: scale(0.99);
  }

  .settings {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #f1f5f9;
  }

  .settings select {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    font-size: 14px;
    color: var(--text-main);
    font-weight: 500;
    outline: none;
  }

  .hidden {
    display: none !important;
  }

  .result-box {
    text-align: center;
    padding: 20px 0;
  }

  .final-score {
    font-size: 56px;
    font-weight: 900;
    color: var(--primary);
    margin: 12px 0;
  }

  .result-msg {
    font-size: 18px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Quiz Section -->
  <div id="quiz-section">
    <header>
      <h1>🇰🇷 Quiz Sơ Cấp 1 — Bài 1</h1>
      <div class="sub">Luyện tập từ vựng tiếng Hàn S & W</div>
    </header>

    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div class="meta">
      <span id="counter">Câu 1/10</span>
      <span id="score">Điểm: 0</span>
    </div>

    <div id="question" class="question-box"></div>
    <div id="answers" class="answers-grid"></div>
    <div id="feedback" class="feedback"></div>

    <button id="next-btn" class="next-btn hidden">Câu tiếp theo →</button>

    <div class="settings">
      <select id="mode-select">
        <option value="ko">🇰🇷 Hàn → Việt</option>
        <option value="vi">🇻🇳 Việt → Hàn</option>
      </select>
      <select id="amount-select">
        <option value="10">10 câu</option>
        <option value="20">20 câu</option>
        <option value="30">30 câu</option>
        <option value="56">Tất cả (56 câu)</option>
      </select>
    </div>
  </div>

  <!-- Result Section -->
  <div id="result-section" class="result-box hidden">
    <h1>🎉 Hoàn thành!</h1>
    <div id="final-score" class="final-score">0/0</div>
    <p id="result-message" class="result-msg"></p>
    <button id="restart-btn" class="restart-btn">🔄 Làm lại bài Quiz</button>
  </div>
</div>

<script>
  const WORDS = [
    // S【1과】
    {"ko": "성명", "vi": "Tên họ / Họ tên"},
    {"ko": "성별", "vi": "Giới tính"},
    {"ko": "생년월일", "vi": "Ngày tháng năm sinh"},
    {"ko": "직업", "vi": "Công việc / Nghề nghiệp"},
    {"ko": "국적", "vi": "Quốc tịch"},
    {"ko": "종교", "vi": "Tôn giáo"},
    {"ko": "연락처", "vi": "Thông tin liên hệ"},
    {"ko": "주소", "vi": "Địa chỉ"},
    {"ko": "전화", "vi": "Số điện thoại"},
    {"ko": "이메일", "vi": "Email"},
    {"ko": "매일", "vi": "Mỗi ngày"},
    {"ko": "매주", "vi": "Mỗi tuần"},
    {"ko": "매달", "vi": "Mỗi tháng"},
    {"ko": "매년", "vi": "Mỗi năm"},
    {"ko": "항상", "vi": "Luôn luôn"},
    {"ko": "자주", "vi": "Thường xuyên"},
    {"ko": "가끔", "vi": "Thỉnh thoảng"},
    {"ko": "(이름을) 부르다", "vi": "Gọi là (tên)"},
    {"ko": "뵙다", "vi": "Gặp (kính ngữ)"},
    {"ko": "그냥", "vi": "Chỉ là / Tự nhiên"},
    {"ko": "(학교에) 들어가다", "vi": "Trúng tuyển / Vào trường"},
    {"ko": "이유", "vi": "Lý do"},
    {"ko": "평일", "vi": "Ngày trong tuần"},
    {"ko": "사 오다", "vi": "Mua về"},
    {"ko": "초대를 받다", "vi": "Được mời"},
    {"ko": "코미디 영화", "vi": "Phim hài"},
    {"ko": "액션 영화", "vi": "Phim hành động"},
    {"ko": "소설책", "vi": "Sách tiểu thuyết"},
    {"ko": "시간이 나다", "vi": "Rảnh rỗi / Có thời gian"},
    {"ko": "스페인어", "vi": "Tiếng Tây Ban Nha"},
    {"ko": "언어", "vi": "Ngôn ngữ"},
    {"ko": "문화", "vi": "Văn hóa"},
    {"ko": "관심", "vi": "Hứng thú / Quan tâm"},
    {"ko": "중남미", "vi": "Trung Nam Mỹ"},
    {"ko": "정도", "vi": "Mức độ / Khoảng"},
    {"ko": "유명하다", "vi": "Nổi tiếng"},
    {"ko": "~에 대해(서)", "vi": "Về (vấn đề / chủ đề)"},
    {"ko": "발표하다", "vi": "Phát biểu / Trình bày"},
    {"ko": "글자", "vi": "Chữ cái / Ký tự"},
    {"ko": "제일", "vi": "Nhất"},
    {"ko": "친하다", "vi": "Thân thiết"},
    {"ko": "성", "vi": "Họ (trong họ tên)"},
    {"ko": "빼다", "vi": "Trừ ra / Bỏ ra"},
    {"ko": "형제들", "vi": "Anh em"},
    {"ko": "비슷하다", "vi": "Giống nhau / Tương tự"},

    // W【1과】
    {"ko": "교회", "vi": "Nhà thờ"},
    {"ko": "언제나", "vi": "Lúc nào cũng"},
    {"ko": "물어보다", "vi": "Hỏi"},
    {"ko": "빌리다", "vi": "Mượn, vay"},
    {"ko": "가져오다", "vi": "Mang theo"},
    {"ko": "켜다", "vi": "Bật"},
    {"ko": "모르다", "vi": "Không biết"},
    {"ko": "줄을 서다", "vi": "Xếp hàng"},
    {"ko": "수첩", "vi": "Sổ tay"},
    {"ko": "뛰어가다", "vi": "Chạy tới"},
    {"ko": "잊어버리다", "vi": "Quên mất"}
  ];

  let pool = [];
  let currentIndex = 0;
  let score = 0;
  let isAnswered = false;

  const quizSection = document.getElementById("quiz-section");
  const resultSection = document.getElementById("result-section");
  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const feedbackEl = document.getElementById("feedback");
  const counterEl = document.getElementById("counter");
  const scoreEl = document.getElementById("score");
  const progressBar = document.getElementById("progress-bar");
  const nextBtn = document.getElementById("next-btn");
  const restartBtn = document.getElementById("restart-btn");
  const modeSelect = document.getElementById("mode-select");
  const amountSelect = document.getElementById("amount-select");
  const finalScoreEl = document.getElementById("final-score");
  const resultMessageEl = document.getElementById("result-message");

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz() {
    const amount = parseInt(amountSelect.value, 10);
    pool = shuffle(WORDS).slice(0, amount);
    currentIndex = 0;
    score = 0;

    quizSection.classList.remove("hidden");
    resultSection.classList.add("hidden");
    loadQuestion();
  }

  function loadQuestion() {
    isAnswered = false;
    const currentItem = pool[currentIndex];
    const mode = modeSelect.value;

    const promptText = mode === "ko" ? currentItem.ko : currentItem.vi;
    const correctAnswer = mode === "ko" ? currentItem.vi : currentItem.ko;

    counterEl.textContent = `Câu ${currentIndex + 1}/${pool.length}`;
    scoreEl.textContent = `Điểm: ${score}`;
    progressBar.style.width = `${(currentIndex / pool.length) * 100}%`;
    questionEl.textContent = promptText;
    feedbackEl.textContent = "";
    nextBtn.classList.add("hidden");

    // Distractors
    const otherItems = shuffle(WORDS.filter(w => w.ko !== currentItem.ko)).slice(0, 3);
    let choices = [correctAnswer];
    otherItems.forEach(item => {
      choices.push(mode === "ko" ? item.vi : item.ko);
    });
    choices = shuffle(choices);

    answersEl.innerHTML = "";
    choices.forEach((choice, idx) => {
      const btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.textContent = `${String.fromCharCode(65 + idx)}. ${choice}`;
      btn.onclick = () => handleAnswer(choice, correctAnswer, btn);
      answersEl.appendChild(btn);
    });
  }

  function handleAnswer(selectedChoice, correctAnswer, selectedBtn) {
    if (isAnswered) return;
    isAnswered = true;

    const allButtons = answersEl.querySelectorAll(".answer-btn");
    allButtons.forEach(btn => btn.disabled = true);

    if (selectedChoice === correctAnswer) {
      score++;
      selectedBtn.classList.add("correct");
      feedbackEl.textContent = "✅ Chính xác!";
      feedbackEl.style.color = "var(--correct-text)";
    } else {
      selectedBtn.classList.add("wrong");
      allButtons.forEach(btn => {
        if (btn.textContent.slice(3) === correctAnswer) {
          btn.classList.add("correct");
        }
      });
      feedbackEl.textContent = `❌ Sai rồi! Đáp án đúng: ${correctAnswer}`;
      feedbackEl.style.color = "var(--wrong-text)";
    }

    scoreEl.textContent = `Điểm: ${score}`;
    nextBtn.classList.remove("hidden");
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < pool.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    const percentage = Math.round((score / pool.length) * 100);
    quizSection.classList.add("hidden");
    resultSection.classList.remove("hidden");

    finalScoreEl.textContent = `${score}/${pool.length} (${percentage}%)`;

    if (percentage >= 90) {
      resultMessageEl.textContent = "🔥 Xuất sắc! Bạn đã thuộc rất kỹ từ vựng.";
    } else if (percentage >= 70) {
      resultMessageEl.textContent = "👏 Khá tốt! Luyện tập thêm để đạt điểm tuyệt đối nhé.";
    } else if (percentage >= 50) {
      resultMessageEl.textContent = "💪 Tạm ổn! Nên ôn lại các từ bạn chọn sai.";
    } else {
      resultMessageEl.textContent = "📚 Cố lên! Hãy ôn tập lại danh sách từ vựng và thử lại nhé.";
    }
  }

  nextBtn.onclick = nextQuestion;
  restartBtn.onclick = startQuiz;
  modeSelect.onchange = startQuiz;
  amountSelect.onchange = startQuiz;

  startQuiz();
</script>

</body>
</html>
```eof

I have generated the single-file HTML interactive Korean vocabulary quiz application containing all 56 words from Lesson 1 (S & W sets).
