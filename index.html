<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Từ Vựng 2A - Bài 3</title>
<style>
  :root {
    --primary: #059669;
    --primary-hover: #047857;
    --bg-gradient: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
    --card-bg: #ffffff;
    --text-main: #065f46;
    --text-muted: #475569;
    --correct-bg: #dcfce7;
    --correct-border: #22c55e;
    --correct-text: #15803d;
    --wrong-bg: #fee2e2;
    --wrong-border: #ef4444;
    --wrong-text: #b91c1c;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 20px 12px;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #1e293b;
  }

  .card {
    width: 100%;
    max-width: 650px;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 6px 0;
    color: var(--text-main);
  }

  .sub {
    color: var(--text-muted);
    font-size: 14px;
  }

  .progress-container {
    height: 10px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 16px;
  }

  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s ease;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    margin: 16px 0 20px 0;
    font-weight: 600;
    font-size: 15px;
    color: var(--text-muted);
  }

  .question-box {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin: 20px 0 28px 0;
    color: #0f172a;
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answers-grid {
    display: grid;
    gap: 12px;
  }

  .answer-btn {
    padding: 16px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    background: #f8fafc;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #1e293b;
  }

  .answer-btn:hover:not(:disabled) {
    background: #ecfdf5;
    border-color: var(--primary);
  }

  .answer-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    color: var(--correct-text);
  }

  .answer-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    color: var(--wrong-text);
  }

  .feedback {
    text-align: center;
    min-height: 28px;
    margin: 16px 0;
    font-weight: 700;
    font-size: 16px;
  }

  .next-btn, .restart-btn {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 16px;
    background: var(--primary);
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .next-btn:hover, .restart-btn:hover {
    background: var(--primary-hover);
  }

  .settings {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #f1f5f9;
  }

  .settings select {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    font-size: 14px;
    color: #1e293b;
    font-weight: 500;
  }

  .hidden { display: none !important; }

  .result-box { text-align: center; padding: 20px 0; }

  .final-score {
    font-size: 52px;
    font-weight: 900;
    color: var(--primary);
    margin: 12px 0;
  }

  .result-msg {
    font-size: 17px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Quiz Section -->
  <div id="quiz-section">
    <header>
      <h1>🇰🇷 Quiz 2A — Bài 3</h1>
      <div class="sub">Chủ đề: 콘서트에 가 봤어요? (Trải nghiệm)</div>
    </header>

    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div class="meta">
      <span id="counter">Câu 1/10</span>
      <span id="score">Điểm: 0</span>
    </div>

    <div id="question" class="question-box"></div>
    <div id="answers" class="answers-grid"></div>
    <div id="feedback" class="feedback"></div>

    <button id="next-btn" class="next-btn hidden">Câu tiếp theo →</button>

    <div class="settings">
      <select id="mode-select">
        <option value="ko">🇰🇷 Hàn → Việt</option>
        <option value="vi">🇻🇳 Việt → Hàn</option>
      </select>
      <select id="amount-select">
        <option value="10">10 câu</option>
        <option value="20">20 câu</option>
        <option value="30">30 câu</option>
        <option value="72">Tất cả (72 câu)</option>
      </select>
    </div>
  </div>

  <!-- Result Section -->
  <div id="result-section" class="result-box hidden">
    <h1>🎉 Hoàn thành!</h1>
    <div id="final-score" class="final-score">0/0</div>
    <p id="result-message" class="result-msg"></p>
    <button id="restart-btn" class="restart-btn">🔄 Làm lại bài Quiz</button>
  </div>
</div>

<script>
  const WORDS = [
    // S【3과】
    {"ko": "콘서트", "vi": "Buổi hòa nhạc / Concert"},
    {"ko": "음악회", "vi": "Buổi biểu diễn âm nhạc"},
    {"ko": "연극", "vi": "Vở kịch"},
    {"ko": "뮤지컬", "vi": "Nhạc kịch"},
    {"ko": "전시회", "vi": "Triển lãm"},
    {"ko": "축제", "vi": "Lễ hội"},
    {"ko": "불꽃놀이", "vi": "Bắn pháo hoa"},
    {"ko": "사물놀이", "vi": "Múa nhạc cụ truyền thống 4 loại"},
    {"ko": "배낭여행", "vi": "Du lịch ba lô / Du lịch bụi"},
    {"ko": "아르바이트", "vi": "Việc làm thêm"},
    {"ko": "번지 점프", "vi": "Nhảy Bungee"},
    {"ko": "스쿠버 다이빙", "vi": "Lặn biển"},
    {"ko": "박물관", "vi": "Bảo tàng"},
    {"ko": "미술관", "vi": "Bảo tàng mỹ thuật"},
    {"ko": "공연장", "vi": "Sân khấu biểu diễn / Nhà hát"},
    {"ko": "놀이공원", "vi": "Công viên giải trí"},
    {"ko": "시간", "vi": "Tiếng / Giờ / Thời gian"},
    {"ko": "달", "vi": "Tháng (đếm số lượng)"},
    {"ko": "분", "vi": "Phút"},
    {"ko": "일", "vi": "Ngày"},
    {"ko": "주[주일]", "vi": "Tuần"},
    {"ko": "개월", "vi": "Tháng (khoảng thời gian)"},
    {"ko": "년", "vi": "Năm"},
    {"ko": "하루", "vi": "Một ngày"},
    {"ko": "갔다 오다", "vi": "Đi rồi về"},
    {"ko": "생선회", "vi": "Gỏi cá / Sashimi"},
    {"ko": "요가", "vi": "Yoga"},
    {"ko": "사막", "vi": "Sa mạc"},
    {"ko": "온천", "vi": "Suối nước nóng"},
    {"ko": "사흘", "vi": "Ba ngày"},
    {"ko": "다시", "vi": "Lại / Lần nữa"},
    {"ko": "빌려 주다", "vi": "Cho mượn"},
    {"ko": "벚꽃", "vi": "Hoa anh đào"},
    {"ko": "국제", "vi": "Quốc tế"},
    {"ko": "영화제", "vi": "Liên hoan phim"},
    {"ko": "재즈", "vi": "Nhạc Jazz"},
    {"ko": "존경하다", "vi": "Tôn kính / Kính trọng"},
    {"ko": "왕", "vi": "Vua"},
    {"ko": "한라산", "vi": "Núi Halla"},
    {"ko": "닭", "vi": "Gà"},
    {"ko": "자리", "vi": "Chỗ / Chỗ ngồi"},
    {"ko": "꼭", "vi": "Nhất định"},
    {"ko": "출장", "vi": "Đi công tác"},
    {"ko": "중요하다", "vi": "Quan trọng"},
    {"ko": "덕수궁", "vi": "Cung Deoksu"},
    {"ko": "글쎄요", "vi": "Để xem đã / Ờ thì..."},
    {"ko": "특히", "vi": "Đặc biệt / Nhất là"},
    {"ko": "가장", "vi": "Nhất"},
    {"ko": "기억에 남다", "vi": "Đáng nhớ / Đọng lại trong ký ức"},
    {"ko": "여러 나라", "vi": "Nhiều quốc gia"},
    {"ko": "감독", "vi": "Đạo diễn"},
    {"ko": "배우", "vi": "Diễn viên"},
    {"ko": "낙타", "vi": "Lạc đà"},
    {"ko": "유럽", "vi": "Châu Âu"},
    {"ko": "말하기 대회", "vi": "Cuộc thi nói"},
    {"ko": "대회에 나가다", "vi": "Tham gia cuộc thi"},
    {"ko": "상을 받다", "vi": "Nhận giải thưởng"},
    {"ko": "경험", "vi": "Kinh nghiệm / Trải nghiệm"},

    // W【3과】
    {"ko": "옛날", "vi": "Ngày xưa / Trước đây"},
    {"ko": "용산", "vi": "Yongsan"},
    {"ko": "놀이기구", "vi": "Trò chơi cảm giác mạnh"},
    {"ko": "삼바", "vi": "Điệu nhảy Samba"},
    {"ko": "발레", "vi": "Múa Ballet"},
    {"ko": "공연", "vi": "Buổi biểu diễn"},
    {"ko": "만리장성", "vi": "Vạn Lý Trường Thành"},
    {"ko": "코끼리", "vi": "Con voi"},
    {"ko": "며칠", "vi": "Mấy ngày / Ngày mấy"},
    {"ko": "빌려 주다", "vi": "Cho vay / Cho mượn"},
    {"ko": "크게 쓰다", "vi": "Viết to"},
    {"ko": "대학원", "vi": "Cao học"},
    {"ko": "자리", "vi": "Chỗ ngồi"},
    {"ko": "고르다", "vi": "Chọn lựa"}
  ];

  let pool = [];
  let currentIndex = 0;
  let score = 0;
  let isAnswered = false;

  const quizSection = document.getElementById("quiz-section");
  const resultSection = document.getElementById("result-section");
  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const feedbackEl = document.getElementById("feedback");
  const counterEl = document.getElementById("counter");
  const scoreEl = document.getElementById("score");
  const progressBar = document.getElementById("progress-bar");
  const nextBtn = document.getElementById("next-btn");
  const restartBtn = document.getElementById("restart-btn");
  const modeSelect = document.getElementById("mode-select");
  const amountSelect = document.getElementById("amount-select");
  const finalScoreEl = document.getElementById("final-score");
  const resultMessageEl = document.getElementById("result-message");

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz() {
    const amount = parseInt(amountSelect.value, 10);
    pool = shuffle(WORDS).slice(0, amount);
    currentIndex = 0;
    score = 0;

    quizSection.classList.remove("hidden");
    resultSection.classList.add("hidden");
    loadQuestion();
  }

  function loadQuestion() {
    isAnswered = false;
    const currentItem = pool[currentIndex];
    const mode = modeSelect.value;

    const promptText = mode === "ko" ? currentItem.ko : currentItem.vi;
    const correctAnswer = mode === "ko" ? currentItem.vi : currentItem.ko;

    counterEl.textContent = `Câu ${currentIndex + 1}/${pool.length}`;
    scoreEl.textContent = `Điểm: ${score}`;
    progressBar.style.width = `${(currentIndex / pool.length) * 100}%`;
    questionEl.textContent = promptText;
    feedbackEl.textContent = "";
    nextBtn.classList.add("hidden");

    const otherItems = shuffle(WORDS.filter(w => w.ko !== currentItem.ko)).slice(0, 3);
    let choices = [correctAnswer];
    otherItems.forEach(item => {
      choices.push(mode === "ko" ? item.vi : item.ko);
    });
    choices = shuffle(choices);

    answersEl.innerHTML = "";
    choices.forEach((choice, idx) => {
      const btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.textContent = `${String.fromCharCode(65 + idx)}. ${choice}`;
      btn.onclick = () => handleAnswer(choice, correctAnswer, btn);
      answersEl.appendChild(btn);
    });
  }

  function handleAnswer(selectedChoice, correctAnswer, selectedBtn) {
    if (isAnswered) return;
    isAnswered = true;

    const allButtons = answersEl.querySelectorAll(".answer-btn");
    allButtons.forEach(btn => btn.disabled = true);

    if (selectedChoice === correctAnswer) {
      score++;
      selectedBtn.classList.add("correct");
      feedbackEl.textContent = "✅ Chính xác!";
      feedbackEl.style.color = "var(--correct-text)";
    } else {
      selectedBtn.classList.add("wrong");
      allButtons.forEach(btn => {
        if (btn.textContent.slice(3) === correctAnswer) {
          btn.classList.add("correct");
        }
      });
      feedbackEl.textContent = `❌ Sai rồi! Đáp án đúng: ${correctAnswer}`;
      feedbackEl.style.color = "var(--wrong-text)";
    }

    scoreEl.textContent = `Điểm: ${score}`;
    nextBtn.classList.remove("hidden");
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < pool.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    const percentage = Math.round((score / pool.length) * 100);
    quizSection.classList.add("hidden");
    resultSection.classList.remove("hidden");

    finalScoreEl.textContent = `${score}/${pool.length} (${percentage}%)`;

    if (percentage >= 90) {
      resultMessageEl.textContent = "🔥 Xuất sắc! Bạn thuộc từ vựng Bài 3 rất siêu.";
    } else if (percentage >= 70) {
      resultMessageEl.textContent = "👏 Khá tốt! Luyện tập thêm chút nữa là hoàn hảo.";
    } else if (percentage >= 50) {
      resultMessageEl.textContent = "💪 Tạm ổn! Hãy thử lại để tăng điểm nhé.";
    } else {
      resultMessageEl.textContent = "📚 Cố lên! Hãy ôn lại từ vựng Bài 3 và làm lại.";
    }
  }

  nextBtn.onclick = nextQuestion;
  restartBtn.onclick = startQuiz;
  modeSelect.onchange = startQuiz;
  amountSelect.onchange = startQuiz;

  startQuiz();
</script>

</body>
</html>
