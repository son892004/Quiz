<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz 2A - Bài 4</title>
<style>
  :root {
    --primary: #059669;
    --primary-hover: #047857;
    --bg-gradient: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
    --card-bg: #ffffff;
    --text-main: #065f46;
    --text-muted: #475569;
    --correct-bg: #dcfce7;
    --correct-border: #22c55e;
    --correct-text: #15803d;
    --wrong-bg: #fee2e2;
    --wrong-border: #ef4444;
    --wrong-text: #b91c1c;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 20px 12px;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #1e293b;
  }

  .card {
    width: 100%;
    max-width: 650px;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 6px 0;
    color: var(--text-main);
  }

  .sub {
    color: var(--text-muted);
    font-size: 14px;
  }

  .progress-container {
    height: 10px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 16px;
  }

  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s ease;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    margin: 16px 0 20px 0;
    font-weight: 600;
    font-size: 15px;
    color: var(--text-muted);
  }

  .question-box {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin: 20px 0 28px 0;
    color: #0f172a;
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answers-grid {
    display: grid;
    gap: 12px;
  }

  .answer-btn {
    padding: 16px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    background: #f8fafc;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #1e293b;
  }

  .answer-btn:hover:not(:disabled) {
    background: #ecfdf5;
    border-color: var(--primary);
  }

  .answer-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    color: var(--correct-text);
  }

  .answer-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    color: var(--wrong-text);
  }

  .feedback {
    text-align: center;
    min-height: 28px;
    margin: 16px 0;
    font-weight: 700;
    font-size: 16px;
  }

  .next-btn, .restart-btn {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 16px;
    background: var(--primary);
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .next-btn:hover, .restart-btn:hover {
    background: var(--primary-hover);
  }

  .settings {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #f1f5f9;
  }

  .settings select {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    font-size: 14px;
    color: #1e293b;
    font-weight: 500;
  }

  .hidden { display: none !important; }

  .result-box { text-align: center; padding: 20px 0; }

  .final-score {
    font-size: 52px;
    font-weight: 900;
    color: var(--primary);
    margin: 12px 0;
  }

  .result-msg {
    font-size: 17px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Quiz Section -->
  <div id="quiz-section">
    <header>
      <h1>🇰🇷 Quiz 2A — Bài 4</h1>
      <div class="sub">Chủ đề: 옷이 좀 큰 것 같아요 (Trang phục & Mua sắm)</div>
    </header>

    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div class="meta">
      <span id="counter">Câu 1/10</span>
      <span id="score">Điểm: 0</span>
    </div>

    <div id="question" class="question-box"></div>
    <div id="answers" class="answers-grid"></div>
    <div id="feedback" class="feedback"></div>

    <button id="next-btn" class="next-btn hidden">Câu tiếp theo →</button>

    <div class="settings">
      <select id="mode-select">
        <option value="ko">🇰🇷 Hàn → Việt</option>
        <option value="vi">🇻🇳 Việt → Hàn</option>
      </select>
      <select id="amount-select">
        <option value="10">10 câu</option>
        <option value="20">20 câu</option>
        <option value="30">30 câu</option>
        <option value="59">Tất cả (59 câu)</option>
      </select>
    </div>
  </div>

  <!-- Result Section -->
  <div id="result-section" class="result-box hidden">
    <h1>🎉 Hoàn thành!</h1>
    <div id="final-score" class="final-score">0/0</div>
    <p id="result-message" class="result-msg"></p>
    <button id="restart-btn" class="restart-btn">🔄 Làm lại bài Quiz</button>
  </div>
</div>

<script>
  const WORDS = [
    // S【4과】
    {"ko": "블라우스", "vi": "Áo sơ mi nữ / Áo blouse"},
    {"ko": "스웨터", "vi": "Áo len"},
    {"ko": "양복", "vi": "Bộ âu phục / Vest"},
    {"ko": "티셔츠", "vi": "Áo phông"},
    {"ko": "청바지", "vi": "Quần jeans / Quần bò"},
    {"ko": "양말", "vi": "Tất / Vớ"},
    {"ko": "넥타이", "vi": "Cà vạt"},
    {"ko": "장갑", "vi": "Găng tay"},
    {"ko": "스카프", "vi": "Khăn quàng cổ"},
    {"ko": "입다", "vi": "Mặc (quần, áo)"},
    {"ko": "쓰다", "vi": "Đội (mũ), đeo (kính)"},
    {"ko": "끼다", "vi": "Đeo (găng tay, nhẫn)"},
    {"ko": "하다", "vi": "Thắt (cà vạt), quàng (khăn)"},
    {"ko": "신다", "vi": "Đi / Mang (giày, dép, tất)"},
    {"ko": "마음에 들다", "vi": "Hài lòng / Thích"},
    {"ko": "마음에 안 들다", "vi": "Không hài lòng"},
    {"ko": "잘 어울리다", "vi": "Rất hợp"},
    {"ko": "잘 안 어울리다", "vi": "Không hợp lắm"},
    {"ko": "사이즈", "vi": "Kích cỡ / Size"},
    {"ko": "가격", "vi": "Giá cả"},
    {"ko": "색깔", "vi": "Màu sắc"},
    {"ko": "길이", "vi": "Chiều dài"},
    {"ko": "좀 크다", "vi": "Hơi to / Hơi rộng"},
    {"ko": "잘 맞다", "vi": "Vừa vặn"},
    {"ko": "좀 작다", "vi": "Hơi nhỏ / Hơi chật"},
    {"ko": "비싸다", "vi": "Đắt"},
    {"ko": "싸다", "vi": "Rẻ"},
    {"ko": "밝다", "vi": "Sáng"},
    {"ko": "어둡다", "vi": "Tối"},
    {"ko": "길다", "vi": "Dài"},
    {"ko": "짧다", "vi": "Ngắn"},
    {"ko": "옷값", "vi": "Giá tiền quần áo"},
    {"ko": "맛", "vi": "Hương vị / Vị"},
    {"ko": "내용", "vi": "Nội dung"},
    {"ko": "디자인", "vi": "Thiết kế"},
    {"ko": "유행하다", "vi": "Thịnh hành / Mốt"},
    {"ko": "훨씬", "vi": "Hơn hẳn / Hơn nhiều"},
    {"ko": "시골", "vi": "Nông thôn / Quê"},
    {"ko": "건강하다", "vi": "Khỏe mạnh"},
    {"ko": "굽이 높다", "vi": "Đế cao / Gót cao"},
    {"ko": "교환하다", "vi": "Đổi (hàng)"},
    {"ko": "환불하다", "vi": "Hoàn tiền / Trả lại hàng"},
    {"ko": "등산화", "vi": "Giày leo núi"},
    {"ko": "필요하다", "vi": "Cần thiết"},
    {"ko": "절약하다", "vi": "Tiết kiệm"},
    {"ko": "직접", "vi": "Trực tiếp"},
    {"ko": "주문하다", "vi": "Đặt hàng / Gọi món"},
    {"ko": "면접", "vi": "Phỏng vấn"},
    {"ko": "물어보다", "vi": "Hỏi / Hỏi thăm"},
    {"ko": "노량진", "vi": "Noryangjin"},
    {"ko": "수산 시장", "vi": "Chợ hải sản"},
    {"ko": "동네", "vi": "Xóm / Làng / Khu phố"},
    {"ko": "싱싱하다", "vi": "Tươi / Tươi sống"},
    {"ko": "넣다", "vi": "Bỏ vào / Cho vào"},
    {"ko": "고추장", "vi": "Tương ớt Hàn Quốc"},

    // W【4과】
    {"ko": "결혼식", "vi": "Lễ kết hôn / Đám cưới"},
    {"ko": "헤어지다", "vi": "Chia tay"},
    {"ko": "돈을 벌다", "vi": "Kiếm tiền"},
    {"ko": "바라다", "vi": "Mong muốn / Hi vọng"}
  ];

  let pool = [];
  let currentIndex = 0;
  let score = 0;
  let isAnswered = false;

  const quizSection = document.getElementById("quiz-section");
  const resultSection = document.getElementById("result-section");
  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const feedbackEl = document.getElementById("feedback");
  const counterEl = document.getElementById("counter");
  const scoreEl = document.getElementById("score");
  const progressBar = document.getElementById("progress-bar");
  const nextBtn = document.getElementById("next-btn");
  const restartBtn = document.getElementById("restart-btn");
  const modeSelect = document.getElementById("mode-select");
  const amountSelect = document.getElementById("amount-select");
  const finalScoreEl = document.getElementById("final-score");
  const resultMessageEl = document.getElementById("result-message");

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz() {
    const amount = parseInt(amountSelect.value, 10);
    pool = shuffle(WORDS).slice(0, amount);
    currentIndex = 0;
    score = 0;

    quizSection.classList.remove("hidden");
    resultSection.classList.add("hidden");
    loadQuestion();
  }

  function loadQuestion() {
    isAnswered = false;
    const currentItem = pool[currentIndex];
    const mode = modeSelect.value;

    const promptText = mode === "ko" ? currentItem.ko : currentItem.vi;
    const correctAnswer = mode === "ko" ? currentItem.vi : currentItem.ko;

    counterEl.textContent = `Câu ${currentIndex + 1}/${pool.length}`;
    scoreEl.textContent = `Điểm: ${score}`;
    progressBar.style.width = `${(currentIndex / pool.length) * 100}%`;
    questionEl.textContent = promptText;
    feedbackEl.textContent = "";
    nextBtn.classList.add("hidden");

    const otherItems = shuffle(WORDS.filter(w => w.ko !== currentItem.ko)).slice(0, 3);
    let choices = [correctAnswer];
    otherItems.forEach(item => {
      choices.push(mode === "ko" ? item.vi : item.ko);
    });
    choices = shuffle(choices);

    answersEl.innerHTML = "";
    choices.forEach((choice, idx) => {
      const btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.textContent = `${String.fromCharCode(65 + idx)}. ${choice}`;
      btn.onclick = () => handleAnswer(choice, correctAnswer, btn);
      answersEl.appendChild(btn);
    });
  }

  function handleAnswer(selectedChoice, correctAnswer, selectedBtn) {
    if (isAnswered) return;
    isAnswered = true;

    const allButtons = answersEl.querySelectorAll(".answer-btn");
    allButtons.forEach(btn => btn.disabled = true);

    if (selectedChoice === correctAnswer) {
      score++;
      selectedBtn.classList.add("correct");
      feedbackEl.textContent = "✅ Chính xác!";
      feedbackEl.style.color = "var(--correct-text)";
    } else {
      selectedBtn.classList.add("wrong");
      allButtons.forEach(btn => {
        if (btn.textContent.slice(3) === correctAnswer) {
          btn.classList.add("correct");
        }
      });
      feedbackEl.textContent = `❌ Sai rồi! Đáp án đúng: ${correctAnswer}`;
      feedbackEl.style.color = "var(--wrong-text)";
    }

    scoreEl.textContent = `Điểm: ${score}`;
    nextBtn.classList.remove("hidden");
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < pool.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    const percentage = Math.round((score / pool.length) * 100);
    quizSection.classList.add("hidden");
    resultSection.classList.remove("hidden");

    finalScoreEl.textContent = `${score}/${pool.length} (${percentage}%)`;

    if (percentage >= 90) {
      resultMessageEl.textContent = "🔥 Xuất sắc! Bạn thuộc từ vựng Bài 4 rất siêu.";
    } else if (percentage >= 70) {
      resultMessageEl.textContent = "👏 Khá tốt! Luyện tập thêm chút nữa là hoàn hảo.";
    } else if (percentage >= 50) {
      resultMessageEl.textContent = "💪 Tạm ổn! Hãy thử lại để tăng điểm nhé.";
    } else {
      resultMessageEl.textContent = "📚 Cố lên! Hãy ôn lại từ vựng Bài 4 và làm lại.";
    }
  }

  nextBtn.onclick = nextQuestion;
  restartBtn.onclick = startQuiz;
  modeSelect.onchange = startQuiz;
  amountSelect.onchange = startQuiz;

  startQuiz();
</script>

</body>
</html>
